version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # This version is part of the audited benchmark contract. Upgrade it only
    # through an explicit compatibility review that updates the contract tests.
    ignore:
      - dependency-name: mazebench
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /replay
    schedule:
      interval: weekly
      day: monday
    groups:
      replay-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
